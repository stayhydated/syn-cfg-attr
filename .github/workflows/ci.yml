name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable
  SCCACHE_GHA_ENABLED: true
  RUSTC_WRAPPER: sccache

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Run tests
        run: cargo test --workspace --all-features --all-targets --locked

      - name: Run doctests
        run: cargo test --workspace --all-features --doc --locked

  fmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  quality:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Taplo and ShellCheck
        uses: taiki-e/install-action@v2.87.29
        with:
          tool: "taplo@0.10.0,shellcheck@0.11.0"
          checksum: true
          fallback: none
      - name: Check TOML formatting
        run: taplo fmt --check
      - name: Check Markdown
        uses: rvben/rumdl@v0.3.0
        with:
          version: "0.2.78"
          command: check
          path: "."
          fail-on-error: "true"
      - name: Prevent checkout-controlled typos executable reuse
        run: test ! -e typos && test ! -L typos
      - name: Check spelling
        uses: crate-ci/typos@v1.51.1
        with:
          write_changes: false
      - uses: cargo-bins/cargo-binstall@v1.26.0
        with:
          version: "1.25.1"
      - name: Install derive sorter
        run: cargo binstall cargo-sort-derives --version '=0.13.0' --locked --no-confirm
      - name: Check derive order
        run: cargo sort-derives --check
      - name: Check workflows
        uses: docker://rhysd/actionlint:1.7.12 # includes ShellCheck and pyflakes
      - name: Check shell scripts
        run: git ls-files -z '*.sh' '*.bash' | xargs -0 --no-run-if-empty shellcheck

  dependencies:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check dependency advisories and sources
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          rust-version: stable
          arguments: "--workspace --all-features --locked"
          command: check
          command-arguments: "advisories sources"

  site:
    runs-on: ubuntu-latest
    env:
      MDBOOK_BUILD__CREATE_MISSING: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"
      - uses: cargo-bins/cargo-binstall@v1.26.0
        with:
          version: "1.25.1"
      - name: Install Dioxus CLI
        run: cargo binstall dioxus-cli --version '=0.7.9' --locked --no-confirm
      - name: Validate locked dependency resolution
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Build book, llms and WASM site without deploying
        run: bash scripts/ci/site.sh
      - name: Check tracked lockfile drift
        run: git diff --exit-code -- Cargo.lock ':(glob)**/Cargo.lock'

  clippy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Lint code
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps --locked

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Check crates.io package
        run: cargo publish --dry-run --locked

  machete:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: cargo-bins/cargo-binstall@v1.26.0
        with:
          version: "1.25.1"
      - name: Install cargo-machete
        run: cargo binstall cargo-machete --version '=0.9.2' --locked --no-confirm
      - name: Check unused dependencies
        run: cargo machete

  rust-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - uses: cargo-bins/cargo-binstall@v1.26.0
        with:
          version: "1.25.1"

      - name: Install cargo-llvm-cov
        shell: bash
        run: cargo binstall cargo-llvm-cov --version '=0.9.1' --locked --no-confirm

      - name: Run coverage
        shell: bash
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --all-features --all-targets --locked --cobertura --output-path=target/cobertura.xml

      - name: Codecov publish
        uses: codecov/codecov-action@v7
        with:
          files: target/cobertura.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Codecov housekeeping
        shell: bash
        run: |
          rm -f codecov codecov.SHA256SUM codecov.SHA256SUM.sig

  release:
    name: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, fmt, quality, dependencies, site, clippy, docs, package, machete, rust-coverage]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Publish unpublished crate versions
        uses: release-plz/action@v0.5.143
        with:
          command: release
          version: 0.3.162
        env:
          GITHUB_TOKEN: ${{ github.token }}
