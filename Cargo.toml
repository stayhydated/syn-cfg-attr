[workspace]
default-members = [ "." ]
members = [ "web", "xtask" ]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"
version = "0.3.0"

[workspace.dependencies]
anyhow = "1.0"
clap = "4.6"
dioxus = { default-features = false, version = "=0.7.10" }
stayhydated-dioxus = { git = "https://github.com/stayhydated/shared", rev = "74aec628e81fc4cc04b2f34ef22c63ba95847334" }
stayhydated-site = { git = "https://github.com/stayhydated/shared", rev = "74aec628e81fc4cc04b2f34ef22c63ba95847334" }
stayhydated-xtask = { git = "https://github.com/stayhydated/shared", rev = "74aec628e81fc4cc04b2f34ef22c63ba95847334" }
web = { path = "web" }

[package]
name = "syn-cfg-attr"
description = """
Expand cfg_attr entries in syn attribute lists while preserving guard conditions.
"""
edition = "2024"
license = "MIT OR Apache-2.0"
publish = true
readme = "README.md"
repository = "https://github.com/stayhydated/syn-cfg-attr"
rust-version = "1.98"
version = "0.3.0"

[lints]
workspace = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { features = [ "full", "extra-traits" ], version = "3.0" }

[workspace.lints.rust]
future_incompatible = "deny"
nonstandard_style = "deny"
unexpected_cfgs = { check-cfg = [ "cfg(coverage)" ], level = "deny" }
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
derive_partial_eq_without_eq = "warn"
err_expect = "warn"
incompatible_msrv = "deny"
iter_on_single_items = "warn"
needless_bool = "warn"
redundant_clone = "warn"
todo = "deny"
type_complexity = "allow"
uninlined_format_args = "allow"
unused_trait_names = "warn"
useless_conversion = "warn"

[profile.dev]
codegen-units = 16
debug = "limited"
opt-level = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
